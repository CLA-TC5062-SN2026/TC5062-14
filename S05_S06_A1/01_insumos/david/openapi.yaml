components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        code: *id003
        message: *id003
        details:
          type: array
          items: *id003
        traceId: *id003
      required:
      - code
      - message
    Resource:
      type: object
      properties:
        id: *id002
        status: *id003
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        links:
          type: object
          additionalProperties: *id003
      required:
      - id
      - status
      - createdAt
    Collection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    MutationRequest:
      type: object
      properties:
        action: *id003
        status: *id003
        description: *id003
        decision:
          type: string
          enum:
          - accept
          - reject
          - counteroffer
          - confirm
          - dispute
          - request_changes
        reason: *id003
        data:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    RegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum:
          - client
          - worker
          - organization
      required:
      - email
      - password
      - role
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password: *id003
      required:
      - email
      - password
    TokenResponse:
      type: object
      properties:
        accessToken: *id003
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
      required:
      - accessToken
      - tokenType
      - expiresIn
    MessageRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - text
    ProjectRequest:
      type: object
      properties:
        workType: *id003
        zone: *id003
        preferredDates:
          type: array
          items:
            type: string
            format: date
        description: *id003
        budget:
          type: number
          minimum: 0
      required:
      - workType
      - zone
      - preferredDates
      - description
    ProfileRequest:
      type: object
      properties:
        name: *id003
        photoUrl:
          type: string
          format: uri
        trade: *id003
        yearsExperience:
          type: integer
          minimum: 0
        zone: *id003
        organizationName: *id003
        contactRepresentative: *id003
        trades:
          type: array
          items: *id003
    AppointmentRequest:
      type: object
      properties:
        projectId: *id002
        workerId: *id002
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required:
      - projectId
      - workerId
      - startAt
      - endAt
    ProposalRequest:
      type: object
      properties:
        appointmentId: *id002
        workDescription: *id003
        materials:
          type: array
          items: *id003
        cost:
          type: number
          minimum: 0
        plannedDates: *id003
      required:
      - appointmentId
      - workDescription
      - materials
      - cost
      - plannedDates
    ProgressRequest:
      type: object
      properties:
        photoUrl:
          type: string
          format: uri
        message:
          type: string
          minLength: 1
      required:
      - photoUrl
      - message
    ReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 1
      required:
      - rating
      - comment
    ReportRequest:
      type: object
      properties:
        subjectType:
          type: string
          enum:
          - worker
          - client
          - job
          - review
        subjectId: *id002
        reason: *id003
        severity:
          type: string
          enum:
          - normal
          - potentially_serious
      required:
      - subjectType
      - subjectId
      - reason
