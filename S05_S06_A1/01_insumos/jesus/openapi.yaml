        '500': {$ref: '#/components/responses/ServerError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    ProviderId: {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    RequestId: {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    AppointmentId: {name: appointmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ProposalId: {name: proposalId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ChangeId: {name: changeId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
  responses:
    BadRequest: {description: Petición mal formada, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: JWT ausente, inválido o expirado, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Rol o propiedad insuficiente, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Recurso no encontrado, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Regla de negocio o esquema inválido, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationError'}}}}
    ServerError: {description: Error interno, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Uuid: {type: string, format: uuid}
    DateTime: {type: string, format: date-time}
    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        role: {type: string, enum: [CLIENTE, PROVEEDOR, ADMINISTRADOR]}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        privacyConsentVersion: {type: string}
    RegisterRequest:
      type: object
      required: [email, password, role, privacyConsentVersion, adultDeclaration]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 10, format: password}
        role: {type: string, enum: [CLIENTE, PROVEEDOR]}
        privacyConsentVersion: {type: string, minLength: 1}
        adultDeclaration: {type: boolean, const: true}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        secondFactorCode: {type: string}
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, minimum: 1}
        user: {$ref: '#/components/schemas/User'}
    ConsentRequest:
      type: object
      required: [privacyVersion, adultDeclaration]
      properties:
        privacyVersion: {type: string}
        adultDeclaration: {type: boolean, const: true}
    Consent:
      type: object
      required: [id, privacyVersion, acceptedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        privacyVersion: {type: string}
        acceptedAt: {$ref: '#/components/schemas/DateTime'}
    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        phone: {type: string}
    ProviderUpsertRequest:
      type: object
      required: [name, modality, trades, experienceYears, coverage]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        modality: {type: string, enum: [TRABAJADOR, ORGANIZACION]}
        trades: {type: array, minItems: 1, items: {type: string, enum: [albanileria, plomeria, electricidad, carpinteria, herreria, pintura, pisos_azulejos, vidrieria_canceleria, tablaroca, impermeabilizacion]}}
        experienceYears: {type: integer, minimum: 0}
        coverage: {type: array, minItems: 1, items: {type: string}}
        generalAvailability: {type: string}
    Provider:
      allOf:
        - $ref: '#/components/schemas/ProviderUpsertRequest'
        - type: object
          required: [id, verificationStatus, rating, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            verificationStatus: {type: object, additionalProperties: {type: string, enum: [DECLARADA, PENDIENTE, VERIFICADA, RECHAZADA, RETIRADA]}}
            rating: {$ref: '#/components/schemas/RatingSummary'}
            updatedAt: {$ref: '#/components/schemas/DateTime'}
            address: {type: string, description: Solo se incluye si la política RF-53 lo autoriza}
    RatingSummary:
      type: object
      required: [average, count]
      properties:
        average: {type: number, minimum: 0, maximum: 5}
        count: {type: integer, minimum: 0}
        dimensions: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 5}}
    RequestCreate:
      type: object
      required: [expectedOutcome, trade, approximateZone]
      properties:
        expectedOutcome: {type: string, minLength: 1}
        trade: {type: string}
        approximateZone: {type: string, minLength: 1}
        desiredDate: {type: string, format: date}
        description: {type: string}
        aiConversationId: {$ref: '#/components/schemas/Uuid'}
        manualCapture: {type: boolean, default: false}
    RequestPatch:
      type: object
      minProperties: 1
      properties:
        description: {type: string}
        dimensions: {type: string}
        materials: {type: string}
        summaryConfirmed: {type: boolean}
        desiredDate: {type: string, format: date}
        address: {type: string, description: Solo se acepta en el momento autorizado por RF-52}
    ServiceRequest:
      allOf:
        - $ref: '#/components/schemas/RequestCreate'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status: {$ref: '#/components/schemas/ProjectStatus'}
            selectedProviderId: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/DateTime'}
            updatedAt: {$ref: '#/components/schemas/DateTime'}
    ProjectStatus: {type: string, enum: [BORRADOR, CONFIRMADA, PROGRAMADO, EN_PROCESO, TERMINADO, CONCLUIDO]}
    SearchRequest:
      type: object
      properties:
        verifiedOnly: {type: boolean}
        similarExperience: {type: boolean}
        sort: {type: string, enum: [rating, price, availability, proximity, guarantee]}
        priceMin: {type: number, minimum: 0}
        priceMax: {type: number, minimum: 0}
        includeWithoutComparablePrice: {type: boolean, default: false}
    SearchResponse:
      type: object
      required: [items, recommendations, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Provider'}}
        recommendations: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/Recommendation'}}
        noResultsMessage: {type: string}
        page: {$ref: '#/components/schemas/PageInfo'}
    Recommendation:
      type: object
      required: [provider, explanation]
      properties:
        provider: {$ref: '#/components/schemas/Provider'}
        explanation: {type: string}
        criteria: {type: array, items: {type: string}}
    AppointmentCreate:
      type: object
      required: [requestId, startsAt, endsAt, costMxn, confirmedByProvider]
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        startsAt: {$ref: '#/components/schemas/DateTime'}
        endsAt: {$ref: '#/components/schemas/DateTime'}
        costMxn: {type: number, minimum: 0}
        confirmedByProvider: {type: boolean}
        isVisit: {type: boolean}
    AppointmentPatch:
      type: object
      minProperties: 1
      properties:
        startsAt: {$ref: '#/components/schemas/DateTime'}
        endsAt: {$ref: '#/components/schemas/DateTime'}
        confirmedByClient: {type: boolean}
        confirmedByProvider: {type: boolean}
        reason: {type: string}
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentCreate'
        - type: object
          required: [id, status, expiresAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [PENDIENTE, CONFIRMADA, EXPIRADA, CANCELADA]}
            expiresAt: {$ref: '#/components/schemas/DateTime'}
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    ProposalCreate:
      type: object
      required: [requestId, workDescription, laborSubtotalMxn, materials, additionalCostsMxn, totalMxn]
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        workDescription: {type: string, minLength: 1}
        dates: {type: array, items: {type: string, format: date}}
        laborSubtotalMxn: {type: number, minimum: 0}
        materials: {type: array, items: {$ref: '#/components/schemas/Material'}}
        additionalCostsMxn: {type: number, minimum: 0}
        totalMxn: {type: number, minimum: 0}
    Material:
      type: object
      required: [description, quantity, unit, unitPriceMxn, subtotalMxn]
      properties:
        description: {type: string}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string}
        unitPriceMxn: {type: number, minimum: 0}
        subtotalMxn: {type: number, minimum: 0}
        brandOrQuality: {type: string}
    Proposal:
      allOf:
        - $ref: '#/components/schemas/ProposalCreate'
        - type: object
          required: [id, version, status, issuedAt, expiresAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            version: {type: integer, minimum: 1}
            status: {type: string, enum: [ENVIADA, ACEPTADA, NEGOCIACION, RECHAZADA, EXPIRADA]}
            issuedAt: {$ref: '#/components/schemas/DateTime'}
            expiresAt: {$ref: '#/components/schemas/DateTime'}
    ProposalDecision:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [ACEPTAR, PEDIR_CAMBIOS, RECHAZAR]}
        comment: {type: string}
    ChangeCreate:
      type: object
      required: [requestId, type, reason, amountDeltaMxn, updatedTotalMxn, affectedItems, proposedDate]
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        type: {type: string, enum: [COSTO, MATERIAL, ALCANCE, FECHA]}
        reason: {type: string, minLength: 1}
        amountDeltaMxn: {type: number}
        updatedTotalMxn: {type: number, minimum: 0}
        affectedItems: {type: array, minItems: 1, items: {type: string}}
        proposedDate: {type: string, format: date}
        initiatedBy: {type: string, enum: [CLIENTE, PROVEEDOR]}
    Change:
      allOf:
        - $ref: '#/components/schemas/ChangeCreate'
        - type: object
          required: [id, status, createdAt, expiresAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [PENDIENTE, ACEPTADO, RECHAZADO, NO_ACEPTADO, EXPIRADO]}
            createdAt: {$ref: '#/components/schemas/DateTime'}
            expiresAt: {$ref: '#/components/schemas/DateTime'}
            aiAnalysis: {type: string, description: Informativo; nunca decide por el usuario}
    ChangeDecision:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [ACEPTAR, RECHAZAR, CONTRAPROPONER]}
        updatedTerms: {$ref: '#/components/schemas/ChangeCreate'}
    Message:
      type: object
      required: [id, content, senderId, sentAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        content: {type: string}
        senderId: {$ref: '#/components/schemas/Uuid'}
        sentAt: {$ref: '#/components/schemas/DateTime'}
    EvaluationCreate:
      type: object
      required: [subjectType, score]
      properties:
        subjectType: {type: string, enum: [PROVEEDOR, CLIENTE]}
        punctuality: {type: integer, minimum: 1, maximum: 5}
        quality: {type: integer, minimum: 1, maximum: 5}
        cleanliness: {type: integer, minimum: 1, maximum: 5}
        budgetAdherence: {type: integer, minimum: 1, maximum: 5}
        score: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string}
    Evaluation:
      allOf:
        - $ref: '#/components/schemas/EvaluationCreate'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [PENDIENTE, PUBLICADA, VENCIDA]}
            createdAt: {$ref: '#/components/schemas/DateTime'}
    FileUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes, objectKey]
      properties:
        fileName: {type: string}
        contentType: {type: string, enum: [image/jpeg, image/png, video/mp4]}
        sizeBytes: {type: integer, minimum: 1, maximum: 5242880}
        objectKey: {type: string, description: Clave interna; no es una URL pública}
    File:
      type: object
      required: [id, fileName, contentType, sizeBytes, downloadUrlExpiresAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        fileName: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer}
        downloadUrl: {type: string, format: uri}
        downloadUrlExpiresAt: {$ref: '#/components/schemas/DateTime'}
    VerificationRequest:
      type: object
      required: [type, fileId]
      properties:
        type: {type: string, enum: [IDENTIDAD, EXPERIENCIA, ORGANIZACION]}
        fileId: {$ref: '#/components/schemas/Uuid'}
    Verification:
      type: object
      required: [type, status]
      properties:
        type: {type: string}
        status: {type: string, enum: [PENDIENTE, VERIFICADA, RECHAZADA, RETIRADA]}
        reason: {type: string}
        reviewedAt: {$ref: '#/components/schemas/DateTime'}
    SupportRequest:
      type: object
      required: [id, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [REGISTRADA, ATENDIDA]}
        createdAt: {$ref: '#/components/schemas/DateTime'}
    PrivacyRequestCreate:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [ACCESO, RECTIFICACION, CANCELACION, OPOSICION]}
        correctedValues: {type: object, additionalProperties: {type: string}}
    PrivacyRequest:
      type: object
      required: [folio, type, status, createdAt]
      properties:
        folio: {type: string}
        type: {type: string}
        status: {type: string, enum: [REGISTRADA, EN_PROCESO, RESPONDIDA, BLOQUEADA]}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        respondedAt: {$ref: '#/components/schemas/DateTime'}
    PrivacyFulfillment:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [EXPORT_JSON_PDF, RECTIFICAR, ANONIMIZAR, RESPONDER]}
        correctedValues: {type: object, additionalProperties: {type: string}}
        responseNote: {type: string}
    VisualRepresentation:
      type: object
      required: [id, status, description, referenceFileId]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [GENERANDO, DISPONIBLE, APROBADA]}
        description: {type: string}
        referenceFileId: {$ref: '#/components/schemas/Uuid'}
        isTechnicalPlan: {type: boolean, const: false}
    AiAnalysis:
      type: object
      required: [summary, isDecision]
      properties:
        summary: {type: string}
        missingData: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
        isDecision: {type: boolean, const: false}
    PrivateLocation:
      type: object
      required: [visibility]
      properties:
        visibility: {type: string, enum: [ZONA_APROXIMADA, DOMICILIO_AUTORIZADO, OCULTO]}
        municipality: {type: string}
        neighborhood: {type: string}
        exactAddress: {type: string, description: Solo con autorización RF-52}
        media: {type: array, items: {$ref: '#/components/schemas/File'}}
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        totalItems: {type: integer}
        totalPages: {type: integer}
    ProviderPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Provider'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    RequestPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ServiceRequest'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    FilePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/File'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    MessagePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        page: {$ref: '#/components/schemas/PageInfo'}
    AuditLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, action, actorId, occurredAt]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              action: {type: string}
              actorId: {$ref: '#/components/schemas/Uuid'}
              occurredAt: {$ref: '#/components/schemas/DateTime'}
              previousEventId: {$ref: '#/components/schemas/Uuid'}
    AvailabilityReport:
      type: object
      required: [month, availabilityPercent, unplannedOutages, plannedMaintenanceNotices]
      properties:
        month: {type: string}
        availabilityPercent: {type: number, minimum: 0, maximum: 100}
        unplannedOutages: {type: array, items: {type: object, additionalProperties: true}}
        plannedMaintenanceNotices: {type: array, items: {type: object, additionalProperties: true}}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [fieldErrors]
          properties:
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string}
                  message: {type: string}
