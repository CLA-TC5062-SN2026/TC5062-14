openapi: 3.0.3
info:
  title: UnCalificado API
  version: 1.0.0
  description: |
    Contrato spec-first del MVP de UnCalificado. La API es stateless y no
    procesa pagos. PostgreSQL conserva datos transaccionales y metadatos;
    los binarios se almacenan en object storage y se entregan mediante URLs
    temporales autorizadas. La implementación objetivo usa API Gateway y
    funciones Lambda agrupadas por capacidad; no implica microservicios
    independientes ni expone detalles de despliegue al consumidor.
  contact:
    name: Equipo UnCalificado
servers:
  - url: https://api.uncalificado.example.com/api/v1
    description: Producción
tags:
  - name: auth
  - name: users
  - name: providers
  - name: requests
  - name: appointments
  - name: proposals
  - name: changes
  - name: messages
  - name: evaluations
  - name: files
  - name: support
  - name: privacy
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Registrar una cuenta pública
      operationId: registerUser
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-3, RF-02-AC-1, RF-02-AC-2, RNF-11-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': {description: Cuenta creada, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: El correo ya está registrado, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Iniciar sesión
      operationId: login
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-02-AC-3, RNF-11-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Sesión iniciada, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /auth/consents:
    post:
      tags: [auth]
      summary: Registrar consentimiento o aceptación de nueva versión
      operationId: createConsent
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RNF-07-AC-1, RNF-14-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '201': {description: Consentimiento registrado, content: {application/json: {schema: {$ref: '#/components/schemas/Consent'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      operationId: logout
      x-acceptance-criteria: [RNF-11-AC-3, RNF-13-AC-1]
      responses:
        '204': {description: Sesión invalidada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      x-acceptance-criteria: [RNF-03-AC-1, RNF-04-AC-1, RNF-04-AC-2, RNF-14-AC-1]
      responses:
        '200': {description: Usuario actual, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [users]
      operationId: updateCurrentUser
      x-acceptance-criteria: [RF-54-AC-2, RNF-04-AC-1, RNF-11-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200': {description: Usuario actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3, RF-26-AC-4, RF-27-AC-1, RF-28-AC-1, RF-28-AC-2, RF-29-AC-1, RF-29-AC-2, RF-29-AC-3, RF-29-AC-4, RF-29-AC-5, RF-29-AC-6, RF-30-AC-1, RF-30-AC-2, RF-30-AC-3, RF-30-AC-4, RF-07-AC-4, RNF-08-AC-1, RNF-10-AC-1]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: oficio, in: query, schema: {type: string}}
        - {name: zona, in: query, schema: {type: string}}
        - {name: fecha, in: query, schema: {type: string, format: date}}
        - {name: verificado, in: query, schema: {type: boolean}}
        - {name: experienciaSimilar, in: query, schema: {type: boolean}}
        - {name: ordenarPor, in: query, schema: {type: string, enum: [calificacion, precio, disponibilidad, cercania, garantia]}}
        - {name: precioMin, in: query, schema: {type: number, minimum: 0}}
        - {name: precioMax, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200': {description: Resultados paginados, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [providers]
      operationId: createProviderProfile
      x-acceptance-criteria: [RF-05-AC-1, RF-05-AC-2, RF-03-AC-1, RF-03-AC-2, RF-03-AC-4, RF-06-AC-3, RNF-03-AC-1, RNF-04-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderUpsertRequest'}
      responses:
        '201': {description: Perfil creado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /providers/{providerId}:
    parameters: [{$ref: '#/components/parameters/ProviderId'}]
    get:
      tags: [providers]
      operationId: getProvider
      x-acceptance-criteria: [RF-07-AC-1, RF-07-AC-2, RF-07-AC-3, RF-07-AC-4, RF-07-AC-5, RF-08-AC-1, RF-08-AC-2, RF-08-AC-3, RF-53-AC-1, RF-53-AC-2, RF-53-AC-3, RNF-01-AC-1, RNF-01-AC-2, RNF-02-AC-1, RNF-02-AC-2, RNF-04-AC-2, RNF-08-AC-1]
      responses:
        '200': {description: Perfil público autorizado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      tags: [providers]
      operationId: replaceProvider
      x-acceptance-criteria: [RF-03-AC-3, RF-05-AC-1, RF-06-AC-1, RF-06-AC-2, RNF-04-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderUpsertRequest'}
      responses:
        '200': {description: Perfil reemplazado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /providers/{providerId}/portfolio:
    parameters: [{$ref: '#/components/parameters/ProviderId'}]
    get:
      tags: [providers, files]
      operationId: listPortfolio
      x-acceptance-criteria: [RF-04-AC-1, RF-04-AC-2, RNF-06-AC-1]
      responses:
        '200': {description: Fotos del portafolio, content: {application/json: {schema: {$ref: '#/components/schemas/FilePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [providers, files]
      operationId: addPortfolioFile
      x-acceptance-criteria: [RF-04-AC-1, RF-18-AC-1, RF-18-AC-2, RF-18-AC-3, RNF-06-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUploadRequest'}
      responses:
        '201': {description: Archivo asociado, content: {application/json: {schema: {$ref: '#/components/schemas/File'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /providers/{providerId}/verifications:
    parameters: [{$ref: '#/components/parameters/ProviderId'}]
    post:
      tags: [providers]
      operationId: submitVerification
      x-acceptance-criteria: [RF-09-AC-1, RF-09-AC-2, RF-10-AC-1, RF-10-AC-2, RF-11-AC-1, RF-11-AC-2, RF-12-AC-1, RF-12-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationRequest'}
      responses:
        '201': {description: Verificación enviada, content: {application/json: {schema: {$ref: '#/components/schemas/Verification'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /providers/{providerId}/verifications/{verificationId}:
    parameters:
      - {$ref: '#/components/parameters/ProviderId'}
      - {name: verificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    patch:
      tags: [providers]
      operationId: reviewVerification
      x-acceptance-criteria: [RF-09-AC-1, RF-09-AC-2, RF-10-AC-1, RF-10-AC-2, RF-11-AC-1, RF-11-AC-2, RF-12-AC-1, RF-12-AC-2, RNF-04-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [VERIFICADA, RECHAZADA, RETIRADA]}
                reason: {type: string}
      responses:
        '200': {description: Verificación revisada, content: {application/json: {schema: {$ref: '#/components/schemas/Verification'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-5, RF-21-AC-1, RF-21-AC-2, RF-45-AC-1, RNF-03-AC-1, RNF-04-AC-2, RNF-13-AC-1]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: estado, in: query, schema: {$ref: '#/components/schemas/ProjectStatus'}}]
      responses:
        '200': {description: Solicitudes del usuario, content: {application/json: {schema: {$ref: '#/components/schemas/RequestPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [requests]
      operationId: createRequest
      x-acceptance-criteria: [RF-13-AC-1, RF-13-AC-2, RF-14-AC-1, RF-14-AC-2, RF-14-AC-3, RF-14-AC-4, RF-14-AC-5, RF-15-AC-1, RF-15-AC-2, RF-15-AC-3, RF-15-AC-4, RF-16-AC-1, RF-16-AC-2, RF-16-AC-3, RF-16-AC-4, RF-16-AC-5, RF-19-AC-1, RF-19-AC-2, RF-20-AC-1, RF-20-AC-2, RF-20-AC-3, RF-20-AC-4, RF-21-AC-1, RF-21-AC-2, RF-21-AC-3, RF-22-AC-1, RF-22-AC-2, RF-22-AC-3, RF-23-AC-1, RF-23-AC-2, RF-24-AC-1, RF-24-AC-2, RF-24-AC-3, RF-25-AC-1, RF-25-AC-2, RF-27-AC-1, RF-30-AC-1, RF-30-AC-2, RF-30-AC-3, RF-30-AC-4, RNF-01-AC-2, RNF-08-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestCreate'}
      responses:
        '201': {description: Solicitud creada, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    get:
      tags: [requests]
      operationId: getRequest
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-5, RF-20-AC-1, RF-20-AC-2, RF-20-AC-3, RF-20-AC-4, RF-31-AC-2, RF-44-AC-1, RF-44-AC-2, RF-45-AC-1, RF-52-AC-1, RF-52-AC-4, RF-52-AC-5, RNF-03-AC-1, RNF-04-AC-2, RNF-13-AC-1]
      responses:
        '200': {description: Solicitud, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [requests]
      operationId: updateRequest
      x-acceptance-criteria: [RF-14-AC-5, RF-16-AC-3, RF-16-AC-4, RF-17-AC-2, RF-19-AC-1, RF-19-AC-2, RF-20-AC-2, RF-20-AC-3, RF-21-AC-2, RF-24-AC-1, RF-24-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequestPatch'}
      responses:
        '200': {description: Solicitud actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/attachments:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post:
      tags: [requests, files]
      operationId: addRequestAttachment
      x-acceptance-criteria: [RF-17-AC-1, RF-17-AC-2, RF-17-AC-3, RF-18-AC-1, RF-18-AC-2, RF-18-AC-3, RF-18-AC-4, RF-21-AC-2, RNF-06-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUploadRequest'}
      responses:
        '201': {description: Archivo asociado, content: {application/json: {schema: {$ref: '#/components/schemas/File'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Archivo excede el límite, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/visual-representations:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post:
      tags: [requests, files]
      operationId: createVisualRepresentation
      x-acceptance-criteria: [RF-23-AC-1, RF-23-AC-2, RNF-06-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, referenceFileIds]
              properties:
                description: {type: string, minLength: 1}
                referenceFileIds: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '201': {description: Representación generada, content: {application/json: {schema: {$ref: '#/components/schemas/VisualRepresentation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/search:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post:
      tags: [requests, providers]
      operationId: searchProviders
      x-acceptance-criteria: [RF-26-AC-1, RF-26-AC-2, RF-26-AC-3, RF-26-AC-4, RF-27-AC-1, RF-28-AC-1, RF-28-AC-2, RF-29-AC-1, RF-29-AC-2, RF-29-AC-3, RF-29-AC-4, RF-29-AC-5, RF-29-AC-6, RF-30-AC-1, RF-30-AC-2, RF-30-AC-3, RF-30-AC-4, RF-31-AC-1, RF-31-AC-2, RF-31-AC-3]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200': {description: Resultados y recomendaciones, content: {application/json: {schema: {$ref: '#/components/schemas/SearchResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/selection:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    put:
      tags: [requests]
      operationId: selectProvider
      x-acceptance-criteria: [RF-31-AC-1, RF-31-AC-2, RF-31-AC-3, RF-24-AC-1, RF-24-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200': {description: Proveedor seleccionado, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/provider-decision:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post:
      tags: [requests]
      operationId: decideProviderRequest
      x-acceptance-criteria: [RF-32-AC-1, RF-32-AC-2, RF-32-AC-3, RF-32-AC-4, RNF-08-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [ACEPTAR, RECHAZAR]}
      responses:
        '200': {description: Decisión del proveedor registrada, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Solicitud expirada o ya decidida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /requests/{requestId}/support-requests:
    parameters: [{$ref: '#/components/parameters/RequestId'}]
    post:
      tags: [requests, support]
      operationId: createSupportRequest
      x-acceptance-criteria: [RF-22-AC-1, RF-22-AC-2, RF-22-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1}
      responses:
        '201': {description: Soporte solicitado, content: {application/json: {schema: {$ref: '#/components/schemas/SupportRequest'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/ServerError'}
  /appointments:
    post:
      tags: [appointments]
      operationId: createAppointmentProposal
      x-acceptance-criteria: [RF-32-AC-4, RF-33-AC-1, RF-34-AC-1, RF-34-AC-2, RF-34-AC-3, RF-34-AC-4, RF-34-AC-5, RF-34-AC-6, RF-35-AC-1, RF-35-AC-3, RF-36-AC-1, RF-36-AC-2, RF-36-AC-3, RF-37-AC-3, RF-52-AC-3, RNF-08-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCreate'}
      responses:
        '201': {description: Cita propuesta, content: {application/json: {schema: {$ref: '#/components/schemas/Appointment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
